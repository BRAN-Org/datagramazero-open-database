name: BRAN Org Continuous Integration

on:
  push:
    branches: [ main, master, development ]
  pull_request:
    branches: [ main, master, development ]

jobs:
  lint-and-syntax:
    name: Code Syntax & Lint Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.2.0
        with:
          node-version: 20.x
          cache: 'npm'
      - run: npm ci
      - name: Syntax Check JavaScript Source Files
        run: |
          node --check server.js
          node --check src/config.js
          node --check src/dataManager.js
          node --check src/exportEngine.js
          node --check src/statsEngine.js
          node --check src/routes.js
          node --check public/js/app.js
          node --check public/js/charts.js
          node --check public/js/pure-svg-charts.bundle.js

  dataset-validation:
    name: Dataset Schema Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.2.0
        with:
          node-version: 20.x
          cache: 'npm'
      - run: npm ci
      - name: Validate DataGramaZero Dataset
        run: npm run data:validate

  unit-and-api-tests:
    name: Unit & REST API Tests (Node ${{ matrix.node-version }})
    needs: [lint-and-syntax, dataset-validation]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.2.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - name: Run Test Suite
        run: npm test
