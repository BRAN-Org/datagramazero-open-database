name: CRONA Database Guard

on:
  push:
    branches: [ main, master ]
    paths:
      - 'data/**'
      - 'provenance.json'
      - 'schemas/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'data/**'
      - 'provenance.json'
      - 'schemas/**'
  workflow_dispatch:

jobs:
  crona-guard:
    uses: BRAN-Org/.github/.github/workflows/crona-database-ci.yml@main
    with:
      data_file: 'data/datagramazero_articles.json'
      sample_size: 25
    secrets:
      CRONA_APP_ID: ${{ secrets.CRONA_APP_ID }}
      CRONA_PRIVATE_KEY: ${{ secrets.CRONA_PRIVATE_KEY }}
