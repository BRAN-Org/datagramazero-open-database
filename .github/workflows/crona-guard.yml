name: CRONA Database Guard

on:
  push:
    branches: [ main, master ]
    paths:
      - 'data/**'
      - 'provenance.json'
      - 'schemas/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'data/**'
      - 'provenance.json'
      - 'schemas/**'
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      sync_zenodo:
        description: 'Sincronizar com Zenodo'
        type: boolean
        default: false

jobs:
  crona-guard:
    uses: BRAN-Org/.github/.github/workflows/crona-database-ci.yml@main
    with:
      data_file: 'data/datagramazero_articles.json'
      sample_size: 25
      sync_zenodo: ${{ inputs.sync_zenodo || false }}
    secrets:
      CRONA_APP_ID: ${{ secrets.CRONA_APP_ID }}
      CRONA_PRIVATE_KEY: ${{ secrets.CRONA_PRIVATE_KEY }}
      ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
