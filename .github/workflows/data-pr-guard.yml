name: Data Repository Contribution Policy Guard

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write
  issues: write

jobs:
  check-external-pr:
    name: Enforce Data Contribution Policy
    if: github.event.pull_request.head.repo.fork == true
    runs-on: ubuntu-latest
    steps:
      - name: Notify and close fork PR on data repository
        uses: actions/github-script@v7
        with:
          script: |
            const message = `Olá! Agradecemos pelo interesse em colaborar com a **BRAN Org**.

            Conforme documentado em nossas [diretrizes de contribuição](https://github.com/BRAN-Org/.github/blob/main/CONTRIBUTING.md#1-correção-e-apontamento-de-erros-em-dados), repositórios de bases de dados acadêmicas **não aceitam alterações diretas de dados via Pull Request** de forks externos para assegurar a rastreabilidade estrita da proveniência (\`provenance.json\`) e a integridade da fonte primária.

            Para reportar divergências ou correções de metadados:
            1. Abra uma **Issue** neste repositório.
            2. Forneça o link da publicação oficial na fonte primária.

            Nossa equipe de curadoria auditará a fonte e aplicará a atualização canônica.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: message
            });

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              state: 'closed'
            });
